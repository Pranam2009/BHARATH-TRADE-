<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="neonCyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="4" stroke-dasharray="16 24" opacity="0.4" />
  
  <!-- Cyber Hexagon Shield -->
  <polygon points="256,110 376,180 376,320 256,390 136,320 136,180" fill="#090d16" stroke="url(#neonCyanViolet)" stroke-width="8" filter="url(#glow)" />

  <!-- Tech Monogram BT -->
  <text x="256" y="295" font-family="monospace, sans-serif" font-size="125" font-weight="900" text-anchor="middle" fill="url(#neonCyanViolet)" filter="url(#glow)">BT</text>

  <!-- Corner Accents -->
  <circle cx="256" cy="110" r="8" fill="#00f0ff" />
  <circle cx="376" cy="320" r="8" fill="#a855f7" />
  <circle cx="136" cy="320" r="8" fill="#00f0ff" />
</svg>
